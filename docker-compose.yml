services:
  ai-jail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-jail
    volumes:
      - ./workspace:/workspace
      - ./config:/home/dev/.config
      - ~/.ssh/id_ed25519.pub:/home/dev/.ssh/id_ed25519.pub:ro
      - ~/.ssh/config:/home/dev/.ssh/config:ro
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
    environment:
      GH_TOKEN: ${GH_TOKEN}
      HOME: /home/dev
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    ports:
      - "3000:3000"
      - "4000:4000"
      - "5000:5000"
      - "6000:6000"
      - "7000:7000"
      - "8000:8000"
      - "9000:9000"
      - "10000:10000"
    stdin_open: true
    tty: true
    restart: unless-stopped

  openclaude:
    build:
      context: .
      dockerfile: Dockerfile.openclaude
    container_name: openclaude
    depends_on:
      - ai-jail
    volumes:
      - ./workspace:/workspace
      - ./config:/home/dev/.config
      - ./openclaude-config:/home/dev/.config
      - ~/.ssh/id_ed25519.pub:/home/dev/.ssh/id_ed25519.pub:ro
      - ~/.ssh/config:/home/dev/.ssh/config:ro
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
    environment:
      HOME: /home/dev
      GH_TOKEN: ${GH_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      CLAUDE_CODE_USE_OPENAI: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5.4-nano
    stdin_open: true
    tty: true
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: symfony_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: symfony_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"

volumes:
  mysql_data: