version: "3.9"

services:
  ai-jail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-jail
    volumes:
      - ./workspace:/workspace
      - ./config:/home/dev/.config
      - ./memory:/home/dev/.memory
      - ~/.ssh/id_ed25519.pub:/home/dev/.ssh/id_ed25519.pub:ro
      - ~/.ssh/config:/home/dev/.ssh/config:ro
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GH_TOKEN: ${GH_TOKEN}
      MEMORY_PATH: /home/dev/.memory
      HOME: /home/dev
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    ports:
      - "3000:3000"
      - "4000:4000"
      - "5000:5000"
      - "6000:6000"
      - "7000:7000"
      - "8000:8000"
      - "9000:9000"
      - "10000:10000"
    stdin_open: true
    tty: true
    restart: unless-stopped

  openclaude:
    build:
      context: .
      dockerfile: Dockerfile.openclaude
    container_name: openclaude
    depends_on:
      - ai-jail
    volumes:
      - ./workspace:/workspace
      - ./config:/home/dev/.config
      - ./memory:/home/dev/.memory
      - ./openclaude-config:/home/dev/.config
      - ~/.ssh/id_ed25519.pub:/home/dev/.ssh/id_ed25519.pub:ro
      - ~/.ssh/config:/home/dev/.ssh/config:ro
      - ~/.ssh/known_hosts:/home/dev/.ssh/known_hosts:ro
    environment:
      HOME: /home/dev
      MEMORY_PATH: /home/dev/.memory
      GH_TOKEN: ${GH_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      # OpenClaude -> OpenAI-compatible mode
      CLAUDE_CODE_USE_OPENAI: "1"
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_MODEL: qwen/qwen3-coder:free
      # Optional but recommended by OpenRouter
      HTTP-Referer: https://github.com/PedroNogueira/ai-jail
      X-OpenRouter-Title: AI Jail
      # Optional for CI/headless handling if you use it
      OPENCLAUDE_HEADLESS: "0"
    stdin_open: true
    tty: true
    restart: unless-stopped