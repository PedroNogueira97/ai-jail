version: "3.9"

services:
  ai-jail:
    build: .
    container_name: ai-jail
    volumes:
      - ./workspace:/workspace
      - ./config:/home/dev/.config
      - ./memory:/home/dev/.memory
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GH_TOKEN: ${GH_TOKEN}
      MEMORY_PATH: /home/dev/.memory
      HOME: /home/dev
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
    ports:
      - 3000:3000
      - 4000:4000
      - 5000:5000
      - 6000:6000
      - 7000:7000
      - 8000:8000
      - 9000:9000
      - 10000:10000
    stdin_open: true
    tty: true
    restart: unless-stopped